<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Answer FX draft</title>
<style>
  :root{--cream:#FBF8F1}
  body{margin:0;background:#2a1a12;font-family:-apple-system,"Hiragino Sans",sans-serif;color:#fff;display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:20px}
  .phone{position:relative;width:300px;height:600px;border-radius:28px;overflow:hidden;background:var(--cream);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .cap{text-align:center;font-weight:800;margin:8px 0 0}
  .fake{position:absolute;inset:0;padding:60px 18px;color:#2A1F1A}
  .fake .card{background:#fff;border-radius:16px;padding:16px;font-weight:700;font-size:14px;box-shadow:0 2px 10px rgba(60,30,10,.1)}
  .fake .ch{margin-top:10px;border:1px solid #EDE5D8;border-radius:12px;padding:10px;font-size:13px}
  .fake .hdr{position:absolute;left:0;right:0;top:0;height:44px;background:#8B1A1A}
  .ov{position:absolute;inset:0;pointer-events:none}
  svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  /* ===== correct ===== */
  .ok .dim{animation:okDim 3.4s infinite}
  @keyframes okDim{0%{opacity:0}10%{opacity:1}80%{opacity:1}92%,100%{opacity:0}}
  .ok .santa{animation:okSanta 3.4s infinite;transform-origin:150px 600px}
  @keyframes okSanta{0%{transform:translateY(420px) scale(.9)}16%{transform:translateY(-10px) scale(1.02)}22%{transform:translateY(0) scale(1)}78%{transform:translateY(0)}92%,100%{transform:translateY(460px)}}
  .ok .arm{transform-origin:236px 452px;animation:okArm 3.4s infinite}
  @keyframes okArm{0%,22%{transform:rotate(0)}34%{transform:rotate(26deg)}42%{transform:rotate(-14deg)}50%{transform:rotate(40deg)}62%{transform:rotate(8deg)}68%{transform:rotate(-8deg)}74%{transform:rotate(8deg)}80%,100%{transform:rotate(0)}}
  .ok .gift{animation:okGift 3.4s infinite;transform-origin:0 0}
  @keyframes okGift{0%,22%{transform:translate(262px,300px) scale(.55) rotate(0);opacity:1}34%{transform:translate(296px,314px) scale(.55) rotate(20deg)}
    42%{transform:translate(240px,262px) scale(1) rotate(-20deg)}58%{transform:translate(150px,290px) scale(6.5) rotate(340deg);opacity:1}62%{transform:translate(150px,290px) scale(7.2) rotate(360deg);opacity:0}100%{opacity:0}}
  .ok .flash{animation:okFlash 3.4s infinite}
  @keyframes okFlash{0%,57%{opacity:0}60%{opacity:.85}72%,100%{opacity:0}}
  .ok .burst{transform-origin:150px 290px;animation:okBurst 3.4s infinite}
  @keyframes okBurst{0%,58%{transform:scale(.2);opacity:0}62%{opacity:1}84%{transform:scale(1.25);opacity:1}92%,100%{transform:scale(1.35);opacity:0}}
  .ok .eyesA{animation:blink 3.4s infinite}
  @keyframes blink{0%,64%{opacity:1}66%,70%{opacity:0}72%,100%{opacity:1}}
  .ok .wink{animation:wink 3.4s infinite;opacity:0}
  @keyframes wink{0%,64%{opacity:0}66%,70%{opacity:1}72%,100%{opacity:0}}

  /* ===== wrong ===== */
  .ng .dim{animation:ngDim 3.4s infinite}
  @keyframes ngDim{0%{opacity:0}8%{opacity:1}82%{opacity:1}94%,100%{opacity:0}}
  .ng .gift{animation:ngGift 3.4s infinite;transform-origin:0 0}
  @keyframes ngGift{0%{transform:translate(150px,300px) scale(0);opacity:0}10%{transform:translate(150px,300px) scale(2.4);opacity:1}
    14%,40%{transform:translate(150px,300px) scale(2.2)}46%,52%{transform:translate(84px,314px) scale(1.25) rotate(-10deg)}
    56%{transform:translate(108px,314px) scale(1.25) rotate(-6deg)}74%{transform:translate(-378px,300px) scale(1.25) rotate(-16deg)}100%{transform:translate(-378px,300px);opacity:0}}
  .ng .glow{transform-origin:150px 300px;animation:ngGlow 3.4s infinite}
  @keyframes ngGlow{0%,8%{opacity:0;transform:scale(.4)}14%,40%{opacity:1;transform:scale(1)}48%,100%{opacity:0;transform:scale(1.3)}}
  .ng .santa{animation:ngSanta 3.4s infinite}
  @keyframes ngSanta{0%,16%{transform:translate(360px,0)}34%{transform:translate(150px,0)}40%{transform:translate(140px,0)}46%,52%{transform:translate(132px,0)}
    56%{transform:translate(156px,0)}74%{transform:translate(-330px,-14px)}100%{transform:translate(-330px,-14px)}}
  .ng .speed{animation:ngSpeed 3.4s infinite}
  @keyframes ngSpeed{0%,54%{opacity:0}58%,72%{opacity:.9}78%,100%{opacity:0}}
  .ng .puff{transform-origin:150px 330px;animation:ngPuff 3.4s infinite}
  @keyframes ngPuff{0%,62%{opacity:0;transform:scale(.3)}70%{opacity:.95;transform:scale(1)}88%{opacity:0;transform:scale(1.4)}100%{opacity:0}}
  .ng .sparkle{animation:tw 1s infinite}
  @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
</style></head><body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E23A3A"/><stop offset=".6" stop-color="#B01E1E"/><stop offset="1" stop-color="#6E1010"/></linearGradient>
    <radialGradient id="skin" cx=".42" cy=".38" r=".75"><stop offset="0" stop-color="#FCE3D0"/><stop offset=".7" stop-color="#EFBC9C"/><stop offset="1" stop-color="#D99878"/></radialGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#D5DAE0"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0B3"/><stop offset=".4" stop-color="#E6BE45"/><stop offset="1" stop-color="#9A700A"/></linearGradient>
    <linearGradient id="giftRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E8433A"/><stop offset="1" stop-color="#8E1414"/></linearGradient>
    <linearGradient id="giftGreen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E9A55"/><stop offset="1" stop-color="#14532D"/></linearGradient>
    <radialGradient id="okDim" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#5a1010" stop-opacity=".55"/><stop offset="1" stop-color="#1a0606" stop-opacity=".82"/></radialGradient>
    <radialGradient id="goldGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE9A0" stop-opacity=".95"/><stop offset=".5" stop-color="#F5D06F" stop-opacity=".35"/><stop offset="1" stop-color="#F5D06F" stop-opacity="0"/></radialGradient>

    <!-- gift centered at 0,0 (~70px wide) -->
    <g id="gift">
      <rect x="-32" y="-16" width="64" height="46" rx="4" fill="url(#giftRed)"/>
      <rect x="-36" y="-26" width="72" height="14" rx="3" fill="#C42A26"/>

      <rect x="-30" y="-14" width="22" height="5" rx="2" fill="#fff" opacity=".25"/>
    </g>

    <!-- ===== realistic santa (front). frame 300 wide, head ~y280-410, body to y820 ===== -->
    <filter id="fur" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .56  0 0 0 0 .6  0 0 0 .35 -.05" result="shade"/>
      <feComposite in="shade" in2="d" operator="in" result="s"/>
      <feMerge><feMergeNode in="d"/><feMergeNode in="s"/></feMerge>
    </filter>
    <filter id="hair" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".9 .08" numOctaves="2" seed="3" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 .55  0 0 0 0 .58  0 0 0 0 .64  0 0 0 .55 -.12" result="streak"/>
      <feComposite in="streak" in2="SourceGraphic" operator="in" result="s"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="s"/></feMerge>
    </filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <radialGradient id="skinR" cx=".45" cy=".4" r=".72"><stop offset="0" stop-color="#F9DCC6"/><stop offset=".55" stop-color="#EDB896"/><stop offset=".85" stop-color="#D99572"/><stop offset="1" stop-color="#B9765A"/></radialGradient>
    <radialGradient id="noseR" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#F7B6A2"/><stop offset=".6" stop-color="#E07F68"/><stop offset="1" stop-color="#B85A48"/></radialGradient>
    <radialGradient id="cheekR" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#E8705E" stop-opacity=".55"/><stop offset="1" stop-color="#E8705E" stop-opacity="0"/></radialGradient>
    <linearGradient id="beardR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#EEF0F2"/><stop offset="1" stop-color="#C9CDD3"/></linearGradient>
    <linearGradient id="coatR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6E0F0F"/><stop offset=".25" stop-color="#B51E1E"/><stop offset=".5" stop-color="#D42C2A"/><stop offset=".75" stop-color="#B01C1C"/><stop offset="1" stop-color="#5E0C0C"/></linearGradient>
    <linearGradient id="hatR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D93030"/><stop offset=".55" stop-color="#A81B1B"/><stop offset="1" stop-color="#5E0C0C"/></linearGradient>
    <linearGradient id="furR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCDDDF"/></linearGradient>
    <linearGradient id="leather" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4A3A30"/><stop offset=".5" stop-color="#231912"/><stop offset="1" stop-color="#0E0906"/></linearGradient>
    <radialGradient id="iris" cx=".45" cy=".4" r=".6"><stop offset="0" stop-color="#9C7A55"/><stop offset=".7" stop-color="#5E4128"/><stop offset="1" stop-color="#2E1E12"/></radialGradient>

    </g>

      <rect x="146" y="532" width="8" height="30" rx="2" fill="url(#gold)"/>
      <!-- resting arm (viewer left) -->
      <path d="M78,462 C46,494 40,546 54,590" stroke="#9E1A1A" stroke-width="40" stroke-linecap="round" fill="none"/>
      <path d="M70,470 C50,500 46,540 54,576" stroke="#D2302C" stroke-width="10" stroke-linecap="round" fill="none" opacity=".35" filter="url(#blur3)"/>
      <ellipse cx="56" cy="592" rx="26" ry="14" fill="url(#furR)" filter="url(#fur)"/>

      <ellipse cx="150" cy="448" rx="60" ry="18" fill="#3a0606" opacity=".45" filter="url(#blur6)"/>

      <!-- ears -->

      <!-- face -->

        <path d="M94,380 C98,410 108,436 120,456 M206,380 C202,410 192,436 180,456"/>

      <!-- mouth -->

      <path d="M134,394 C142,398 158,398 166,394 L164,398 C156,401 144,401 136,398 Z" fill="#F4EEE6"/>
      <!-- mustache -->

        <path d="M150,370 C138,360 118,360 104,370 C94,378 88,392 80,394 C92,402 112,400 126,392 C138,386 146,382 150,380 Z" fill="url(#beardR)"/>
        <path d="M150,370 C162,360 182,360 196,370 C206,378 212,392 220,394 C208,402 188,400 174,392 C162,386 154,382 150,380 Z" fill="url(#beardR)"/>

      <use href="#mitten" transform="translate(-54,440) rotate(180)"/>

  </defs>
</svg>

<div>
  <div class="phone ok">
    <div class="fake"><div class="hdr"></div><div class="card">問題文がここに入ります。<div class="ch">A 選択肢</div><div class="ch">B 選択肢</div><div class="ch">C 選択肢</div></div></div>
