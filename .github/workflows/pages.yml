name: Test and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  tests:
    uses: ./.github/workflows/tests.yml
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble tracked public files only
        run: |
          mkdir "$RUNNER_TEMP/site"
          git archive HEAD index.html sw.js icon.svg icon-180.png icon-192.png icon-512.png data guide mock-assets CLOUD_HANDOFF.md | tar -x -C "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
